<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Labeling Tomat</title>
<style>
  :root { --mentah:#2ecc71; --setengah:#f39c12; --matang:#e74c3c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Segoe UI,sans-serif; background:#1b2430; color:#eee; }
  #topbar { display:flex; gap:10px; align-items:center; padding:10px 14px; background:#0f1620; border-bottom:1px solid #2c3e50; position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  #topbar h1 { font-size:16px; margin:0 8px 0 0; color:#8ab4f8; }
  #imagePicker { max-width:300px; }
  #counter { color:#7f8c9b; font-size:13px; }
  .clsbtn { border:none; padding:8px 14px; border-radius:6px; cursor:pointer; font-weight:600; color:#111; opacity:.55; }
  .clsbtn.active { opacity:1; box-shadow:0 0 0 2px #fff; }
  #cls0 { background:var(--mentah);} #cls1 { background:var(--setengah);} #cls2 { background:var(--matang);}
  .btn { background:#2c3e50; border:none; color:#eee; padding:8px 12px; border-radius:6px; cursor:pointer; font-weight:600; }
  .btn:hover { background:#3d566e; }
  .btn.primary { background:#1a73e8; }
  .btn.primary:hover { background:#2f82ff; }
  .btn.danger { background:#c0392b; }
  #wrap { position:relative; width:fit-content; margin:16px auto; }
  canvas { display:block; background:#000; cursor:crosshair; max-width:calc(100vw - 40px); max-height:calc(100vh - 120px); }
  #msg { position:fixed; right:16px; top:62px; background:#27ae60; color:#fff; padding:8px 14px; border-radius:6px; display:none; z-index:9; }
  #hint { text-align:center; color:#7f8c9b; font-size:13px; margin-top:4px; }
  #datalist { font-size:12px; }
  .box { position:absolute; border:2px solid transparent; }
  .box:hover, .box.selected { border-color:#fff; }
  .box .tag { position:absolute; top:-18px; left:0; font-size:11px; padding:1px 5px; border-radius:3px; color:#111; white-space:nowrap; }
  #empty { text-align:center; padding:80px 20px; color:#7f8c9b; }
  #empty a { color:#8ab4f8; }
  .progress { font-size:12px; color:#95a5a6; }
</style>
</head>
<body>
<div id="topbar">
  <h1>🍅 Labeling Tomat</h1>
  <select id="imagePicker" class="btn"></select>
  <span id="counter"></span>
  <span class="clsbtn active" id="cls0">1 · Mentah</span>
  <span class="clsbtn" id="cls1">2 · Setengah</span>
  <span class="clsbtn" id="cls2">3 · Matang</span>
  <button class="btn danger" id="btnDelete">Hapus box (D)</button>
  <button class="btn" id="btnClear">Bersihkan semua</button>
  <button class="btn primary" id="btnSave">Simpan (S)</button>
  <span class="progress" id="progress"></span>
</div>
<div id="datalist"></div>
<div id="wrap">
  <canvas id="cv"></canvas>
</div>
<div id="hint">Klik-drag untuk membuat kotak · tombol 1/2/3 pilih kelas · klik box untuk pilih &amp; hapus · S simpan</div>
<div id="msg">Tersimpan</div>

<script type="text/javascript">
const CLASSES = __CLASSES__;
const COLORS = ['#2ecc71','#f39c12','#e74c3c'];
let state = {
  images: [], idx: -1, boxes: [], curCls: 0,
  selected: -1, dragging: null, img: null,
};
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const picker = document.getElementById('imagePicker');
const msg = document.getElementById('msg');

function fitImage() {
  const maxW = window.innerWidth - 44;
  const maxH = window.innerHeight - 150;
  let w = state.img.width, h = state.img.height;
  const sc = Math.min(1, maxW / w, maxH / h);
  cv.width = w * sc; cv.height = h * sc;
  cv.style.width = cv.width + 'px'; cv.style.height = cv.height + 'px';
  state.scale = sc;
  render();
}

function toNorm(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) / r.width,
    y: (e.clientY - r.top) / r.height,
  };
}

function render() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.drawImage(state.img, 0, 0, cv.width, cv.height);
  const sc = state.scale;
  state.boxes.forEach((b, i) => {
    const x1 = b.x1 * cv.width, y1 = b.y1 * cv.height;
    const x2 = b.x2 * cv.width, y2 = b.y2 * cv.height;
    const sel = i === state.selected;
    ctx.strokeStyle = COLORS[b.cls];
    ctx.lineWidth = sel ? 3 : 2;
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    ctx.fillStyle = COLORS[b.cls];
    ctx.fillRect(x1, y1 - 18, Math.min(120, x2 - x1), 18);
    ctx.fillStyle = '#111';
    ctx.font = '12px Segoe UI';
    ctx.fillText((i+1) + ' · ' + CLASSES[b.cls], x1 + 4, y1 - 4);
  });
  if (state.dragging) {
    const {x1,y1,x2,y2} = state.dragging;
    ctx.strokeStyle = COLORS[state.curCls];
    ctx.lineWidth = 2;
    ctx.setLineDash([6,4]);
    ctx.strokeRect(x1*sc*0+cv.width*(0), y1*cv.height, (x2-x1)*cv.width, (y2-y1)*cv.height);
    ctx.setLineDash([]);
  }
}

cv.addEventListener('mousedown', e => {
  const p = toNorm(e);
  state.selected = -1;
  state.dragging = {x1:p.x, y1:p.y, x2:p.x, y2:p.y, cls:state.curCls};
});
cv.addEventListener('mousemove', e => {
  if (!state.dragging) return;
  const p = toNorm(e);
  state.dragging.x2 = p.x; state.dragging.y2 = p.y;
  render();
});
cv.addEventListener('mouseup', e => {
  if (!state.dragging) return;
  const d = state.dragging;
  const w = Math.abs(d.x2-d.x1), h = Math.abs(d.y2-d.y1);
  if (w > 0.005 && h > 0.005) {
    state.boxes.push({
      cls: d.cls,
      x1: Math.min(d.x1,d.x2), y1: Math.min(d.y1,d.y2),
      x2: Math.max(d.x1,d.x2), y2: Math.max(d.y1,d.y2),
    });
    state.selected = state.boxes.length - 1;
  }
  state.dragging = null;
  render();
});
cv.addEventListener('click', e => {
  const p = toNorm(e);
  let best = -1;
  state.boxes.forEach((b, i) => {
    if (p.x >= b.x1 && p.x <= b.x2 && p.y >= b.y1 && p.y <= b.y2) {
      if (best < 0) best = i;
    }
  });
  state.selected = best;
  render();
});

document.addEventListener('keydown', e => {
  const k = e.key;
  if (k === '1') setCls(0);
  else if (k === '2') setCls(1);
  else if (k === '3') setCls(2);
  else if (k === 'd' || k === 'D' || k === 'Delete') deleteSelected();
  else if (k === 's' || k === 'S') save();
});

function setCls(i) {
  state.curCls = i;
  ['cls0','cls1','cls2'].forEach((id, idx) => document.getElementById(id).classList.toggle('active', idx === i));
}

async function loadImages() {
  const res = await fetch('/api/images');
  const data = await res.json();
  state.images = data.images;
  picker.innerHTML = '';
  state.images.forEach(n => {
    const opt = document.createElement('option');
    opt.value = n; opt.textContent = n;
    picker.appendChild(opt);
  });
  if (state.images.length) {
    picker.value = state.images[0];
    await openImage(state.images[0]);
  } else {
    document.getElementById('empty').style.display = 'block';
  }
}

async function openImage(name) {
  state.boxes = [];
  state.idx = state.images.indexOf(name);
  picker.value = name;
  state.img = new Image();
  state.img.onload = () => { fitImage(); loadLabels(); };
  state.img.src = '/images/' + encodeURIComponent(name);
  updateCounter();
}

async function loadLabels() {
  const name = state.images[state.idx];
  const res = await fetch('/api/labels?name=' + encodeURIComponent(name));
  const data = await res.json();
  state.boxes = data.boxes;
  state.selected = -1;
  render();
}

function updateCounter() {
  const n = state.images[state.idx];
  document.getElementById('counter').textContent = (state.idx + 1) + '/' + state.images.length;
  document.getElementById('datalist').textContent = 'Ada ' + state.boxes.length + ' box untuk ' + n;
}

async function save() {
  await fetch('/api/labels', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({name: state.images[state.idx], boxes: state.boxes}),
  });
  showMsg();
  updateProgress();
}

function deleteSelected() {
  if (state.selected >= 0) {
    state.boxes.splice(state.selected, 1);
    state.selected = -1;
    render(); updateCounter();
  }
}

function showMsg() {
  msg.style.display = 'block';
  setTimeout(() => msg.style.display = 'none', 1500);
}

async function updateProgress() {
  const res = await fetch('/api/status', {method: 'POST'});
  const d = await res.json();
  document.getElementById('progress').textContent = `✅ ${d.labeled}/${d.images} gambar dilabeli`;
}

picker.addEventListener('change', () => openImage(picker.value));
document.getElementById('btnSave').addEventListener('click', save);
document.getElementById('btnDelete').addEventListener('click', deleteSelected);
document.getElementById('btnClear').addEventListener('click', () => {
  state.boxes = []; state.selected = -1; render(); updateCounter();
});
document.getElementById('cls0').addEventListener('click', () => setCls(0));
document.getElementById('cls1').addEventListener('click', () => setCls(1));
document.getElementById('cls2').addEventListener('click', () => setCls(2));
window.addEventListener('resize', fitImage);

loadImages();
updateProgress();
</script>
</body>
</html>
